name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Build, Audit Claims, Race Test & Attest (Go Stdlib)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Generate CycloneDX 1.5 SBOM (bom.json)
        run: python3 ./scripts/generate-sbom.py bom.json

      - name: Run Empirical Claims Linter Unit Tests
        run: python3 -m unittest discover -s tests

      - name: Verify Zero-Dependency, Zero-Egress & Empirical Claims Gate
        run: python3 ./scripts/audit-claims.py

      - name: Verify gofmt Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files detected:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go Vet Static Analysis
        run: go vet ./...

      - name: Run Unit, Oracle Property & Race Detector Tests
        run: go test -race ./...

      - name: Build Genesis & Benchmark Binaries
        run: |
          make build
          shasum -a 256 bin/genesis bin/genesis-bench bom.json > SHA256SUMS
          cat SHA256SUMS

      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: github.ref == 'refs/heads/main'
        with:
          subject-path: |
            bom.json
            bin/genesis

      - name: Upload CycloneDX SBOM & Binary Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: genesis-release-sbom
          path: |
            bom.json
            SHA256SUMS
            bin/genesis
